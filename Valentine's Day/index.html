<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Day Surprise</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Happy Valentine's Day!</h1>
        
        <div id="heart-container">
            <div class="heart">❤️</div>
        </div>

        <div id="interaction-container">
            <p id="question">Will you be my Valentine? 🥺</p>
            <div class="buttons">
                <button id="yes-btn">Yes! 💖</button>
                <button id="no-btn">No 😢</button>
            </div>
        </div>

        <div id="result-container" style="display: none;">
            <div class="funny-image">🍕 + 😺 = ❤️</div>
            <p class="message" id="love-message">
                I KNEW IT! <br>
                (You didn't really have a choice 😈)<br>
                Happy Valentine's Day! 💖
            </p>
            <button id="reset-btn">Play Again</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
